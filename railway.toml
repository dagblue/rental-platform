[build]
builder = "NIXPACKS"
buildCommand = "npm install && npx prisma generate --schema packages/database/prisma/schema.prisma && npx tsc -p packages/shared/tsconfig.json && npx tsc -p packages/validation/tsconfig.json && npm run build --workspace=packages/database && npx tsc -p packages/auth/tsconfig.json && npx tsc -p apps/backend/tsconfig.json"

[deploy]
startCommand = "node apps/backend/dist/index.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
